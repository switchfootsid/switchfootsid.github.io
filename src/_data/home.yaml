headline:
  - I started out building RL agents.
  - Now I build AI businesses.

intro:
  - >-
    I'm Siddharth. I lead ecosystem strategy for open and frontier models at Quantiphi:
    working out how the newest models become something an enterprise can actually run.
  - >-
    I got here the long way: research at IIT Bombay, engineering at Bosch in Germany,
    years as a solutions architect, then building Quantiphi's NVIDIA business from a blank page.
    Somewhere along the way I stopped treating engineering and go-to-market as separate jobs.
    This site is where I think out loud about both.

beliefs:
  - title: Models are components. Systems are the product.
    text: >-
      The hard, valuable work is in compound AI systems: retrieval, tools, evals,
      and people wired together around a model.
    link: ""        # add the essay link here and an "Essay" link appears

  - quote: >-
      In science, if you know what you are doing, you should not be doing it.
      In engineering, if you do not know what you are doing, you should not be doing it.
    by: Richard Hamming
    text: >-
      I've worked on both sides of that line. Most of my job now is knowing which side a problem is on.

